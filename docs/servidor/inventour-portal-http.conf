# Portais publicos dos destinos, porta 80. Softsul Software, 20/11/2026.
# Redireciona para HTTPS. O certificado curinga e validado por DNS (Route
# 53); o desafio ACME por HTTP fica aqui so para dominio proprio de
# prefeitura, que ganha certificado individual pelo certbot com webroot.
<VirtualHost *:80>
    ServerName portal.inventour.com.br
    ServerAlias *.inventour.com.br

    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/portal.inventour.com.br_error.log
</VirtualHost>
