# app.inventour.com.br, porta 80. Softsul Software, 20/11/2026.
# So existe para responder o desafio ACME e mandar o resto para HTTPS.
<VirtualHost *:80>
    ServerName app.inventour.com.br

    # O desafio HTTP-01 do certbot precisa ser respondido em texto puro na
    # porta 80, ANTES do redirecionamento, senao a renovacao falha.
    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/app.inventour.com.br_error.log
    CustomLog ${APACHE_LOG_DIR}/app.inventour.com.br_access.log combined
</VirtualHost>
