# app.inventour.com.br, painel do InvenTour (PHP 8.3 + MySQL).
# Softsul Software e Zapping Consultoria, multiempresa. Criado em 20/11/2026.
# Certificado Google Trust Services, emitido pelo certbot via webroot.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName app.inventour.com.br
    DocumentRoot /home/www/app.inventour.com.br/public

    # Ficha grande do inventário pode passar dos 1000
    # campos padrão do PHP, e o que passa some calado.
    php_value max_input_vars 10000

    <Directory /home/www/app.inventour.com.br/public>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # Midia publica (fotos dos atrativos e equipamentos) sai direto do
    # Apache, sem PHP: cache de 30 dias, nome com hash. Foto de pessoa NAO
    # fica aqui; passa por /foto, que exige login.
    Alias /midia/ /home/www/app.inventour.com.br/storage/midias/
    <Directory /home/www/app.inventour.com.br/storage/midias>
        Options -Indexes
        AllowOverride None
        Require all granted
        Header set Cache-Control "public, max-age=2592000, immutable"
        # Upload nunca vira código: só imagem, vídeo e PDF saem daqui, e o
        # navegador não adivinha tipo (nosniff). Etapa 7, revisão de segurança.
        Header set X-Content-Type-Options "nosniff"
        <FilesMatch "\.(?i:php\d?|phtml|phar|pl|py|cgi|sh|html?|svg|js)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Defesa em profundidade: nada fora de public/ (e de /midia/) pode ser
    # servido, mesmo que um deploy futuro esqueca o .htaccess.
    <DirectoryMatch "^/home/www/app\.inventour\.com\.br/(app|portal|storage/(?!midias)|vendor|logs|scripts|migracoes|docs)">
        Require all denied
    </DirectoryMatch>

    # HSTS fica no vhost, e nao no .htaccess, para valer ate nas respostas que
    # nao passam pelo PHP. Sem includeSubDomains: os subdominios sao os
    # portais dos destinos, com certificado proprio cada um.
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog ${APACHE_LOG_DIR}/app.inventour.com.br_error.log
    CustomLog ${APACHE_LOG_DIR}/app.inventour.com.br_access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/app.inventour.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/app.inventour.com.br/privkey.pem
</VirtualHost>
</IfModule>
