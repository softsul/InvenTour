# InvenTour: falhas de acesso gravadas por Auditoria::falhaDeAcesso().
# Formato: 2026-10-22 00:15:15 UTC inventour login_negado ip=1.2.3.4
# O fail2ban tira a data da linha antes de aplicar o failregex.
[Definition]
failregex = ^\s*UTC inventour (login_negado|codigo_negado|login_bloqueado|passkey_negada|certificado_negado|esqueci_excedido|limite_excedido) ip=<HOST>$
ignoreregex =
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
