# Portais publicos dos destinos: <slug>.inventour.com.br, e o dominio raiz
# enquanto o site institucional estiver no outro servidor nao passa por aqui.
# Softsul Software, 20/11/2026.
#
# Um vhost so para todos os destinos: o PHP resolve o destino pelo host
# (app/Tenant.php) e o certificado curinga *.inventour.com.br (DNS-01 pelo
# Route 53, docs/servidor/route53) cobre qualquer subdominio. Criar um
# destino nao exige mexer em DNS, certificado nem Apache: o registro
# curinga da zona ja aponta para este servidor.
#
# Nomes explicitos (app, www, mta-sts) tem vhost proprio ou ficam no outro
# servidor; o ServerAlias curinga so pega o que sobrar.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName portal.inventour.com.br
    ServerAlias *.inventour.com.br
    DocumentRoot /home/www/app.inventour.com.br/portal

    <Directory /home/www/app.inventour.com.br/portal>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # Midia publica (fotos dos atrativos e equipamentos), servida pelo Apache sem passar pelo PHP.
    Alias /midia/ /home/www/app.inventour.com.br/storage/midias/
    <Directory /home/www/app.inventour.com.br/storage/midias>
        Options -Indexes
        AllowOverride None
        Require all granted
        Header set Cache-Control "public, max-age=2592000, immutable"
        # Upload nunca vira código: só imagem, vídeo e PDF saem daqui, e o
        # navegador não adivinha tipo (nosniff). Etapa 7, revisão de segurança.
        Header set X-Content-Type-Options "nosniff"
        <FilesMatch "\.(?i:php\d?|phtml|phar|pl|py|cgi|sh|html?|svg|js)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <DirectoryMatch "^/home/www/app\.inventour\.com\.br/(app|public|storage/(?!midias)|vendor|logs|scripts|migracoes|docs)">
        Require all denied
    </DirectoryMatch>

    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog ${APACHE_LOG_DIR}/portal.inventour.com.br_error.log
    # O host vai na frente da linha (inventour_host): e por ele que a leitura
    # dos logs separa os destinos.
    LogFormat "%{Host}i %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" inventour_host
    CustomLog ${APACHE_LOG_DIR}/portal.inventour.com.br_access.log inventour_host

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/inventour.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/inventour.com.br/privkey.pem
</VirtualHost>
</IfModule>
